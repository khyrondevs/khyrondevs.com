name: CI // Quality & Security Perimeter

on:
  push:
    branches:
      - master
      - pre-release
  pull_request:
    branches:
      - master
      - pre-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality, Security & Route Crawler Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      REPLY_SIGNING_SECRET: ${{ secrets.REPLY_SIGNING_SECRET || 'ci-testing-signing-secret-key-32b' }}
      TEST_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (Strict TypeScript)
        run: npx tsc --noEmit

      - name: Lint (ESLint 9)
        run: npm run lint

      - name: Production Build
        run: npm run build

      - name: Start Production Server & Execute Full Test Matrix
        run: |
          npm run start &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          echo "Waiting for Next.js production server on http://localhost:3000..."
          timeout 30s bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 0.5; done'
          echo "Server ready. Executing 62-point automated test suite..."
          npm test
